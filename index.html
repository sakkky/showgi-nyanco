<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>王の御成 - 桂馬ジャンプ＆敵王出撃版</title>
    <style>
        body { 
            font-family: sans-serif; text-align: center; background-color: #f0f0f0; 
            margin: 0; padding: 0; display: flex; justify-content: center;
        }
        #game-container { 
            width: 100%; max-width: 500px;
            background: white; padding: 10px; box-sizing: border-box;
            display: flex; flex-direction: column; min-height: 100vh;
        }
        #header { 
            display: flex; justify-content: space-between; margin-bottom: 5px; 
            font-weight: bold; font-size: 14px; padding: 0 5px;
        }
        
        #board-wrapper {
            width: 100%; position: relative;
            padding-top: 111.11%; 
            margin-bottom: 5px; background-color: #333; border: 2px solid #333; box-sizing: border-box;
        }
        #board { 
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(10, 1fr); gap: 1px; 
        }
        .cell { 
            background-color: #eecfa1; width: 100%; height: 100%;
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .cell.enemy-spawn { background-color: #ffb6c1; } /* 敵の聖域 y=0 */
        .cell.goal-line { background-color: #ffd700; opacity: 0.6; } /* 到達目標ライン (敵陣最前線y=1, 自陣最前線y=8) */
        .cell.player-spawn { background-color: #add8e6; } /* 味方の聖域 y=9 */

        #victory-overlay {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); color: #ffd700; z-index: 100;
            flex-direction: column; align-items: center; justify-content: center;
        }

        .unit { 
            width: 90%; height: 90%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: bold; font-size: clamp(9px, 2.5vw, 13px); color: white; z-index: 10;
        }
        .unit.player { background-color: #4169e1; clip-path: polygon(50% 0%, 100% 20%, 100% 100%, 0 100%, 0 20%); }
        .unit.enemy { background-color: #dc143c; clip-path: polygon(0 0, 100% 0, 100% 80%, 50% 100%, 0 80%); }
        .unit-hp { font-size: clamp(7px, 2vw, 9px); background: rgba(0,0,0,0.6); padding: 1px 2px; border-radius: 2px; margin-top: 1px;}

        #controls { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 5px;
        }
        button { 
            padding: 8px 2px; font-size: 11px; font-weight: bold;
            cursor: pointer; border: none; border-radius: 4px; 
            background-color: #4CAF50; color: white; touch-action: manipulation;
            display: flex; flex-direction: column; align-items: center;
        }
        button:disabled { background-color: #aaa; cursor: not-allowed; }
        .btn-cost { font-size: 9px; opacity: 0.9; font-weight: normal; }
        
        #message { color: #d9534f; font-weight: bold; height: 18px; font-size: 13px; margin: 5px 0;}
    </style>
</head>
<body>

<div id="game-container">
    <div id="header">
        <span id="mana-display">マナ: 0 / 10</span>
        <span id="turn-display">ターン: 0</span>
    </div>

    <div id="board-wrapper">
        <div id="board"></div>
        <div id="victory-overlay">
            <div style="font-size: 28px; font-weight: bold; margin-bottom: 10px;">🎉 王の御成 🎉</div>
            <div style="font-size: 16px; color: white;">敵陣の制圧に成功しました！</div>
            <div style="font-size: 12px; color: #ccc; margin-top: 20px;">ページをリロードしてもう一度プレイ</div>
        </div>
    </div>

    <div id="message">水色の「召喚エリア」をタップ！</div>
    
    <div id="controls">
        <button id="btn-PAWN" onclick="selectUnit('PAWN')">歩<span class="btn-cost" id="cnt-PAWN"></span></button>
        <button id="btn-LANCE" onclick="selectUnit('LANCE')">香車<span class="btn-cost" id="cnt-LANCE"></span></button>
        <button id="btn-KNIGHT" onclick="selectUnit('KNIGHT')">桂馬<span class="btn-cost" id="cnt-KNIGHT"></span></button>
        <button id="btn-SILVER" onclick="selectUnit('SILVER')">銀<span class="btn-cost" id="cnt-SILVER"></span></button>
        <button id="btn-GOLD" onclick="selectUnit('GOLD')">金<span class="btn-cost" id="cnt-GOLD"></span></button>
        <button id="btn-BISHOP" onclick="selectUnit('BISHOP')">角<span class="btn-cost" id="cnt-BISHOP"></span></button>
        <button id="btn-ROOK" onclick="selectUnit('ROOK')">飛車<span class="btn-cost" id="cnt-ROOK"></span></button>
        <button id="btn-KING" onclick="selectUnit('KING')">王<span class="btn-cost" id="cnt-KING"></span></button>
    </div>
</div>

<script>
    const BOARD_COLS = 9;
    const BOARD_ROWS = 10; 
    let turn = 0;
    let mana = 0;
    let maxMana = 10; 
    let selectedUnitType = null;
    let isGameOver = false;
    let units = [];

    const UNIT_DATA = {
        'PAWN':   { name: '歩', hp: 1, atk: 1, cost: 1, maxCount: 9, speed: 1 },
        'LANCE':  { name: '香', hp: 2, atk: 2, cost: 3, maxCount: 2, speed: 2 },
        // 桂馬のspeedはジャンプ回数と解釈し1とする
        'KNIGHT': { name: '桂', hp: 2, atk: 2, cost: 3, maxCount: 2, speed: 1 },
        'SILVER': { name: '銀', hp: 4, atk: 2, cost: 4, maxCount: 2, speed: 1 },
        'GOLD':   { name: '金', hp: 5, atk: 2, cost: 5, maxCount: 2, speed: 1 },
        'BISHOP': { name: '角', hp: 3, atk: 3, cost: 7, maxCount: 1, speed: 3 }, 
        'ROOK':   { name: '飛', hp: 4, atk: 3, cost: 8, maxCount: 1, speed: 3 },
        'KING':   { name: '王', hp: 15, atk: 2, cost: 15, maxCount: 1, speed: 1 },
        'TOKIN':  { name: 'と', hp: 5, atk: 1, cost: 0, maxCount: 0, speed: 1 }
    };

    const boardEl = document.getElementById('board');

    function getAvailableCount(type) {
        const countOnBoard = units.filter(u => u.owner === 'player' && (u.type === type || (type === 'PAWN' && u.type === 'TOKIN'))).length;
        return UNIT_DATA[type].maxCount - countOnBoard;
    }

    function initBoard() {
        boardEl.innerHTML = '';
        for (let y = 0; y < BOARD_ROWS; y++) {
            for (let x = 0; x < BOARD_COLS; x++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                
                if (y === 0) cell.classList.add('enemy-spawn'); 
                else if (y === 1) cell.classList.add('goal-line'); // 到達目標 (味方)
                else if (y === 8) cell.classList.add('goal-line'); // 到達目標 (敵・黄色く強調)
                else if (y === BOARD_ROWS - 1) cell.classList.add('player-spawn'); 
                
                cell.onclick = () => {
                    if (isGameOver) return;
                    if (selectedUnitType && y === BOARD_ROWS - 1) {
                        const cost = UNIT_DATA[selectedUnitType].cost;
                        if (mana >= cost && getAvailableCount(selectedUnitType) > 0) {
                            if (!units.some(u => u.x === x && u.y === y)) {
                                spawnUnit('player', selectedUnitType, x, y);
                                mana -= cost;
                                selectedUnitType = null;
                                document.getElementById('message').innerText = "";
                                updateUI();
                                renderUnits(); 
                            }
                        }
                    }
                };
                cell.id = `cell-${x}-${y}`;
                boardEl.appendChild(cell);
            }
        }
    }

    function spawnUnit(owner, type, x, y) {
        let dx = 0;
        // 角(BISHOP)と桂馬(KNIGHT)は初期状態で斜めに進む方向を決める
        if (type === 'BISHOP' || type === 'KNIGHT') {
            dx = (x > 4) ? -1 : 1; // 右側に置いたら左斜め、左側に置いたら右斜めへ
        }

        units.push({
            id: Math.random().toString(36).substr(2, 9),
            owner: owner, type: type, x: x, y: y, dx: dx,
            hp: UNIT_DATA[type].hp, atk: UNIT_DATA[type].atk, maxHp: UNIT_DATA[type].hp,
            speed: UNIT_DATA[type].speed
        });
    }

    function selectUnit(type) {
        if (isGameOver) return;
        const cost = UNIT_DATA[type].cost;
        if (mana >= cost && getAvailableCount(type) > 0) {
            selectedUnitType = type;
            document.getElementById('message').innerText = `${UNIT_DATA[type].name}を配置してください`;
        }
    }

    function gameLoop() {
        if (isGameOver) return;
        turn++;

        if (turn % 10 === 0 && maxMana < 30) maxMana += 2;
        if (mana < maxMana) mana++;

        let spawnRate = Math.max(1, 4 - Math.floor(turn / 40)); 
        if (turn % spawnRate === 0) {
            const rx = Math.floor(Math.random() * BOARD_COLS);
            if (!units.some(u => u.x === rx && u.y === 0)) {
                let availableEnemies = ['PAWN', 'PAWN', 'PAWN'];
                if (turn > 15) availableEnemies.push('LANCE', 'KNIGHT');
                if (turn > 30) availableEnemies.push('SILVER', 'GOLD');
                if (turn > 45) availableEnemies.push('BISHOP', 'ROOK');
                
                // 【修正】十分なターンが経過したら敵も王将を召喚リストに追加
                if (turn > 60) availableEnemies.push('KING');

                // 敵が王将を召喚する際は、既に敵の王将がいないかチェック
                let enemyType = availableEnemies[Math.floor(Math.random() * availableEnemies.length)];
                
                if (enemyType === 'KING') {
                    const hasEnemyKing = units.some(u => u.type === 'KING' && u.owner === 'enemy');
                    if (hasEnemyKing) {
                        // 既に敵の王将がいる場合は、代わりに歩を召喚
                        enemyType = 'PAWN';
                    }
                }

                spawnUnit('enemy', enemyType, rx, 0);
            }
        }

        processUnits();
        renderUnits();
        checkWinCondition();
        updateUI();
    }

    function processUnits() {
        let activeUnits = [...units];

        activeUnits.forEach(unit => {
            if (unit.hp <= 0) return;

            const dy = (unit.owner === 'player') ? -1 : 1;
            
            const backY = unit.y - dy;
            const allyBehind = units.find(u => u.x === unit.x && u.y === backY && u.owner === unit.owner && u.hp > 0);
            if (allyBehind && unit.hp < unit.maxHp) unit.hp += 1;

            // スピードの数だけ移動判定を繰り返す
            for (let step = 0; step < unit.speed; step++) {
                if (unit.hp <= 0) break; 

                let targetX = unit.x + unit.dx; 
                let targetY = unit.y + dy;

                // 【修正】桂馬のジャンプ移動ロジック
                if (unit.type === 'KNIGHT') {
                    // ルート上の駒を無視するジャンプ。飛び越えるセルの衝突判定をスキップし、2歩先のセルへ。
                    targetY = unit.y + dy * 2; // 2歩前
                    // dxは召喚時に決めた左右どちらか。

                    // 互いの召喚エリアへの侵入禁止 (ジャンプ移動でも適用)
                    if (unit.owner === 'player' && targetY <= 0) break; // y=1でストップ
                    if (unit.owner === 'enemy' && targetY >= BOARD_ROWS - 1) break; // y=8でストップ

                    // サイド壁反射判定 (x座標)
                    if (targetX < 0 || targetX >= BOARD_COLS) {
                        unit.dx *= -1; // 左右を反転
                        targetX = unit.x + unit.dx; // 反射後の位置を再計算
                    }

                    // ジャンプ着地地点の盤面内判定 (y座標は既にチェック、x座標は反射で盤面内へ)
                    if (targetY < 0 || targetY >= BOARD_ROWS) break;

                    const targetUnit = units.find(u => u.x === targetX && u.y === targetY && u.hp > 0);
                    
                    if (targetUnit) {
                        if (targetUnit.owner !== unit.owner) {
                            targetUnit.hp -= unit.atk; // 敵なら戦闘
                        }
                        break; // 味方でも敵でも、ぶつかったらそのターンの移動は終了
                    } else {
                        // ジャンプ移動
                        unit.x = targetX;
                        unit.y = targetY;
                        break; // 桂馬は1ターンの移動アクションを1回のジャンプとする
                    }
                }

                // 【修正】角の壁反射ロジック (dxがある駒、現在は角のみ)
                if (unit.type === 'BISHOP') {
                    if (targetX < 0 || targetX >= BOARD_COLS) {
                        unit.dx *= -1; // 左右を反転
                        targetX = unit.x + unit.dx; // 反射後の位置を再計算
                    }
                }

                // 通常の移動・衝突判定
                if (unit.owner === 'player' && targetY <= 0) break; 
                if (unit.owner === 'enemy' && targetY >= BOARD_ROWS - 1) break; 

                const targetUnit = units.find(u => u.x === targetX && u.y === targetY && u.hp > 0);
                
                if (targetUnit) {
                    if (targetUnit.owner !== unit.owner) {
                        targetUnit.hp -= unit.atk;
                    }
                    break; 
                } else {
                    // 通常移動
                    unit.x = targetX;
                    unit.y = targetY;

                    // 歩の成り (敵陣 y<=2 に入ったら「と金」になる)
                    if (unit.owner === 'player' && unit.type === 'PAWN' && unit.y <= 2) {
                        unit.type = 'TOKIN';
                        unit.hp = UNIT_DATA['TOKIN'].hp;
                        unit.maxHp = UNIT_DATA['TOKIN'].hp;
                        unit.atk = UNIT_DATA['TOKIN'].atk;
                        unit.speed = UNIT_DATA['TOKIN'].speed;
                        unit.dx = 0; // 成ったら直進に戻る
                    }
                }
            }
        });

        units = units.filter(u => u.hp > 0);
    }

    function renderUnits() {
        document.querySelectorAll('.cell').forEach(cell => cell.innerHTML = '');
        units.forEach(unit => {
            const cell = document.getElementById(`cell-${unit.x}-${unit.y}`);
            if (cell) {
                const el = document.createElement('div');
                el.className = `unit ${unit.owner}`;
                el.innerHTML = `${UNIT_DATA[unit.type].name}<br><span class="unit-hp">HP:${unit.hp}</span>`;
                cell.appendChild(el);
            }
        });
    }

    function checkWinCondition() {
        // 勝利判定: y=1 (敵召喚エリアの手前) に王を含む5体の味方がいるか
        const goalUnits = units.filter(u => u.owner === 'player' && u.y === 1);
        const hasKing = goalUnits.some(u => u.type === 'KING');

        if (goalUnits.length >= 5 && hasKing) {
            // オーバーレイを表示してゲーム停止
            document.getElementById('victory-overlay').style.display = "flex";
            isGameOver = true;
        }
    }

    function updateUI() {
        document.getElementById('mana-display').innerText = `マナ: ${mana} / ${maxMana}`;
        document.getElementById('turn-display').innerText = `ターン: ${turn}`;
        
        const hasKing = units.some(u => u.type === 'KING' && u.owner === 'player');

        Object.keys(UNIT_DATA).forEach(type => {
            if (type === 'TOKIN') return; 
            const btn = document.getElementById(`btn-${type}`);
            const countDisplay = document.getElementById(`cnt-${type}`);
            const cost = UNIT_DATA[type].cost;
            const remain = getAvailableCount(type);
            
            countDisplay.innerText = `c:${cost} 残:${remain}`;
            
            // 終了後、またはマナ不足・残弾ゼロでボタン無効
            btn.disabled = isGameOver || (mana < cost || remain <= 0);
        });
    }

    initBoard();
    setInterval(gameLoop, 1500);

</script>
</body>
</html>
